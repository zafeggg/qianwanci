  <!-- ==================== PWA（可安装到手机主屏） ====================
       需求原文："持有 Token 的用户可以下载 N次方 DApp 参与"。
       在没有 Android/iOS 原生工程与打包工具链的前提下，先交付 Web App Manifest + Service Worker：
       手机浏览器可「添加到主屏幕」并以独立窗口运行（standalone），离线可打开外壳。
       原生 APK/IPA 仍需 Capacitor/原生壳 + JDK/Android SDK，步骤见 README。
       ⚠ 用相对路径（./）而不是绝对路径：本项目可能部署在子路径下，且路由是 hash 模式。 -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="千万次" />
</head>
<body>

</body>
